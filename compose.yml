services:
  aula:
    build: .
    ports: ["127.0.0.1:${AULA_PORT:-8788}:8788"]   # put an HTTPS reverse proxy (Caddy, nginx, Traefik) in front
    volumes: ["aula-data:/data"]
    environment:
      AULA_REGISTRATION: ${AULA_REGISTRATION:-open}   # "closed" once your users exist
      AULA_MAX_UPLOAD: ${AULA_MAX_UPLOAD:-25000000}   # bytes per file
    restart: unless-stopped
volumes:
  aula-data:
