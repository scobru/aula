[package]
name = "aula-class"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
freenet-stdlib = { version = "0.8", features = ["contract"] }
whoiam-delegation = { git = "https://github.com/scobru/freenames", rev = "44b38cf102897ca9aaa54709d8231e32a1667ef4" }
sha2 = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", default-features = false }
hex = "0.4"

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

[features]
default = ["freenet-main-contract"]
freenet-main-contract = []

[profile.release]
opt-level = "z"
lto = true
strip = true
